services:
  - type: web
    name: video-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn video_gen.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: video_gen.settings

  - type: worker
    name: video-worker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_generate_worker.py"
    envVars:
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: video_gen.settings
