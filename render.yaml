services:
  - type: web
    name: video-gen-api
    env: python
    plan: free
    
    # Install system dependencies for Manim + FFmpeg
    buildCommand: |
      apt-get update && apt-get install -y \
        ffmpeg \
        libcairo2-dev \
        libpango1.0-dev \
        python3-dev \
        pkg-config \
        texlive \
        texlive-latex-extra \
        texlive-fonts-extra \
        texlive-xetex \
        cm-super \
        dvipng && \
      pip install --upgrade pip && \
      pip install -r requirements.txt
    
    startCommand: python run_combined.py
    healthCheckPath: /api/health/
    
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: video_gen.settings
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: PORT
        value: "10000"

